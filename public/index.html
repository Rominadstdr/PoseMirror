<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Connect</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

    <h1>📹 آینه</h1>

    <div id="home">

        

        <button id="cameraBtn">
            📷 دوربین
        </button>

        <button id="viewerBtn">
            👁 تماشاگر
        </button>

    </div>

    <div id="cameraSection" class="hidden">

        <h2>کد دوربین </h2>

        <div id="roomCode">----</div>

        <p id="status">منتظر بمانید...</p>

        <video
            id="localVideo"
            autoplay
            muted
            playsinline>
        </video>
        <button id="captureLocalBtn">
        📸 عکس گرفتن
        </button>
        <button id="switchCameraBtn">
        🔄 برگرداندن دوربین
        </button>

    </div>

    <div id="viewerSection" class="hidden">

        <h2>وصل شدن به دوربین</h2>

        <input
            id="codeInput"
            maxlength="4"
            placeholder="0000">

        <button id="connectBtn">

            وصل شدن

        </button>

        <video
            id="remoteVideo"
            autoplay
            playsinline>
        </video>

        <button id="captureRemoteBtn">
        📸 عکس گرفتن
        </button>

    </div>

</div>

    <canvas
    id="captureCanvas"
    style="display:none;">
    </canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>

</body>
</html>
