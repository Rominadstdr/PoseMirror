<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>PoseMirror</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="modern.css">


</head>


<body>


<div class="container">


<!-- =========================
        HOME
========================= -->

<section id="home">


    <div class="hero">


        <div class="logo">

            ◉

        </div>


        <h1 class="app-title">

            PoseMirror

        </h1>


        <p class="subtitle">

            نمایش زنده دوربین گوشی

        </p>


    </div>



    <div class="home-buttons">


        <button 
        id="cameraBtn"
        class="primary-btn1">


             دوربین


        </button>



        <button 
        id="viewerBtn"
        class="secondary-btn">


             اتصال به دوربین


        </button>


    </div>



    <div class="features">


        <div class="feature">

            ⚡ سریع

        </div>


        <div class="feature">

            🔒 امن

        </div>


        <div class="feature">

            🎥 HD

        </div>


    </div>


</section>





<!-- =========================
        CAMERA
========================= -->


<section id="cameraSection" class="hidden">


    <button 
    id="backCameraBtn"
    class="back-btn">

        ←

    </button>



        <div class="qr-bar" id="qrSheet">
            
            <div id="qrcode"></div>

    <h3>
     کد اتصال:
    </h3>


    <div id="roomCode" class="room-code">
        ----
    </div>


    <button
    id="refreshCodeBtn"
    class="small-btn">

        🔄

    </button>
    
        </div>





    <div class="video-container">


        <video
        id="localVideo"
        autoplay
        muted
        playsinline>
        </video>



        <div class="connection-badge1" id="cameraStatus">
    <span class="status-dot"></span>
    <span class="status-text">در انتظار اتصال</span>
        </div>


    </div>

<button id="cameraControlsBtn" class="control-toggle">
     Camera Controls
</button>

<div id="cameraControlsPanel" class="camera-panel">

    <div id="zoomControl" class="control-group" style="display:none;">
        <label for="zoomSlider">Zoom</label>
        <input type="range" id="zoomSlider" min="1" max="1" step="0.1" value="1">
    </div>

    <button id="torchBtn" class="control-btn" style="display:none;">
        Flash
    </button>

    <div id="exposureControl" class="control-group" style="display:none;">
        <label for="exposureSlider">Exposure</label>
        <input type="range" id="exposureSlider" min="-2" max="2" step="0.1" value="0">
    </div>

    <div id="focusControl" class="control-group" style="display:none;">
        <label for="focusSelect">Focus</label>
        <select id="focusSelect">
            <option value="">Loading...</option>
        </select>
    </div>

    <div id="qualityControl" class="control-group">
        <label for="qualitySelect">Quality</label>
        <select id="qualitySelect">
            <option value="720">720p</option>
            <option value="1080">1080p</option>
        </select>
    </div>

</div>

<div class="bottom-controls">
    <button id="switchCameraBtn">🔄</button>
    <button id="captureLocalBtn">📸</button>
</div>


</section>







<!-- =========================
        VIEWER
========================= -->


<section id="viewerSection"
class="hidden">


    <button 
    id="backViewerBtn"
    class="back-btn">

        ←

    </button>





    <div class="connect-card">


        <h3>

            اتصال به دوربین

        </h3>



        <input
        id="codeInput"
        maxlength="4"
        placeholder="0000">



        <button
        id="connectBtn"
        class="primary-btn">


            اتصال


        </button>



    </div>






    <div class="video-container">


        <video
        id="remoteVideo"
        autoplay
        playsinline>
        
        
        
        </video>
       
        <div class="connection-badge2" id="viewerStatus">
    <span class="status-dot"></span>
    <span class="status-text">در انتظار اتصال</span>
        </div>


    </div>





    <div class="bottom-controls">


        <button
        id="captureRemoteBtn">


            📸


        </button>


    </div>



</section>





</div>


        <p id="status" style="display:none"></p>




<!-- =========================
        CANVAS
========================= -->


<canvas
id="captureCanvas"
style="display:none;">
</canvas>






<!-- =========================
        SCRIPTS
========================= -->


<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script src="/socket.io/socket.io.js"></script>


<script src="ui.js"></script>

<script src="status.js"></script>

<script src="camera.js"></script>

<script src="webrtc.js"></script>

<script src="capture.js"></script>

<script src="qr.js"></script>

<script src="script.js"></script>



</body>

</html>
