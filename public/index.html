<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Connect</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

    <h1>📹 آینه</h1>

    <div id="home">

        

        <button id="cameraBtn">
            📷 دوربین
        </button>

        <button id="viewerBtn">
            👁 تماشاگر
        </button>

    </div>

    <div id="cameraSection" class="hidden">

        <button id="backCameraBtn">← بازگشت</button>

        <h2>ایجاد کد</h2>

        <div id="roomCode">----</div>

        <button id="refreshCodeBtn" title="تولید کد جدید">
        🔄
        </button>

        <div id="qrcode"></div>

        <p id="status">در انتظار اتصال...</p>

        <video
            id="localVideo"
            autoplay
            muted
            playsinline>
        </video>
        <button id="captureLocalBtn">
        📸  ثبت عکس
        </button>
        <button id="switchCameraBtn">
        🔄 برگرداندن دوربین
        </button>

    </div>

    <div id="viewerSection" class="hidden">

        <button id="backViewerBtn">← بازگشت</button>

        <h2>اتصال به دوربین</h2>

        <input
            id="codeInput"
            maxlength="4"
            placeholder="0000">

        <button id="connectBtn">

           اتصال

        </button>

        <video
            id="remoteVideo"
            autoplay
            playsinline>
        </video>

        <button id="captureRemoteBtn">
        📸 ثبت عکس 
        </button>

    </div>

</div>

    <canvas
    id="captureCanvas"
    style="display:none;">
    </canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script src="/socket.io/socket.io.js"></script>

    <script src="ui.js"></script>
    <script src="camera.js"></script>
    <script src="webrtc.js"></script>
    <script src="capture.js"></script>
    <script src="qr.js"></script>

    <script src="script.js"></script>

</body>
</html>
