<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Connect</title>

    <link rel="stylesheet" href="modern.css">
    
</head>
<body>

    <div class="container">

    <h1>آینه</h1>

    <div id="home">

    <div class="hero">

        <div class="logo">

            📷

        </div>

        <h1 class="app-title">

            PoseMirror

        </h1>

        <p class="subtitle">

            Wireless Camera Monitor

        </p>

    </div>


    <div class="home-buttons">

        <button id="cameraBtn" class="primary-btn">


            <span>📷 شروع دوربین</span>

        </button>


        <button id="viewerBtn" class="secondary-btn">


            <span>👁 اتصال به دوربین</span>

        </button>

    </div>


    <div class="features">

        <div class="feature">

            ⚡ سریع

        </div>

        <div class="feature">

           🔒 امن

        </div>

        <div class="feature">

            🎥 کیفیت HD

        </div>

    </div>

</div>

    <div id="cameraSection" class="hidden">

    <button id="backCameraBtn">

        ←

    </button>

        <div class="camera-header">

            <div class="connection-badge">

                در حال آماده‌سازی دوربین...

            </div>

        </div>

        <h2>کد اتصال</h2>

        <div id="roomCode">----</div>

        <button id="refreshCodeBtn" title="تولید کد جدید">
        🔄
        </button>

        <div id="qrcode"></div>

        <p id="status">در انتظار اتصال...</p>


        <div class="video-container">

            <video
        id="localVideo"
        autoplay
        muted
        playsinline>
            </video>

            <div class="connection-badge">
        در انتظار اتصال...
            </div>

        </div>


        <div class="bottom-controls">

    <button id="switchCameraBtn">
        🔄
    </button>

    <button id="captureLocalBtn">
        📸
    </button>

        </div>

    </div>

    <div id="viewerSection" class="hidden">

        <div class="viewer-header">

            <div class="connection-badge">

        Viewer

            </div>

        </div>

        <button id="backViewerBtn">←</button>

        <h2>اتصال به دوربین</h2>

        <input
            id="codeInput"
            maxlength="4"
            placeholder="0000">

        <button id="connectBtn">

           اتصال

        </button>

        <div class="video-container">

            <video
        id="remoteVideo"
        autoplay
        playsinline>
            </video>

            <div class="connection-badge">
        در حال اتصال...
            </div>

        </div>

        <button id="captureRemoteBtn">
        📸 ثبت عکس 
        </button>

    </div>

</div>

    <canvas
    id="captureCanvas"
    style="display:none;">
    </canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script src="/socket.io/socket.io.js"></script>

    <script src="ui.js"></script>
    <script src="camera.js"></script>
    <script src="webrtc.js"></script>
    <script src="capture.js"></script>
    <script src="qr.js"></script>

    <script src="script.js"></script>

</body>
</html>
