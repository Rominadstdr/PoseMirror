<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PoseMirror</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="modern.css">


</head>


<body>


<div class="container">


<!-- =========================
        HOME
========================= -->

<section id="home">


    <div class="hero">


        <div class="logo">

            ◉

        </div>


        <h1 class="app-title">

            PoseMirror

        </h1>


        <p class="subtitle">

            نمایش زنده دوربین گوشی

        </p>


    </div>



    <div class="home-buttons">


        <button 
        id="cameraBtn"
        class="primary-btn">


            📷 شروع دوربین


        </button>



        <button 
        id="viewerBtn"
        class="secondary-btn">


            👁 اتصال به دوربین


        </button>


    </div>



    <div class="features">


        <div class="feature">

            ⚡ سریع

        </div>


        <div class="feature">

            🔒 امن

        </div>


        <div class="feature">

            🎥 HD

        </div>


    </div>


</section>





<!-- =========================
        CAMERA
========================= -->


<section id="cameraSection" class="hidden">


    <button 
    id="backCameraBtn"
    class="back-btn">

        ←

    </button>



    <div class="qr-card">


        <h3>

            کد اتصال

        </h3>



        <div id="roomCode"
        class="room-code">

            ----

        </div>



        <div id="qrcode"
        class="qr-box">

        </div>



        <button
        id="refreshCodeBtn"
        class="small-btn">


            🔄 تولید کد جدید


        </button>


    </div>





    <div class="video-container">


        <video
        id="localVideo"
        autoplay
        muted
        playsinline>
        </video>



        <div 
        class="connection-badge"
        id="cameraStatus">

            🟡 در انتظار اتصال

        </div>


    </div>





    <div class="bottom-controls">


        <button 
        id="switchCameraBtn">

            🔄

        </button>



        <button 
        id="captureLocalBtn">

            📸

        </button>


    </div>


</section>







<!-- =========================
        VIEWER
========================= -->


<section id="viewerSection"
class="hidden">


    <button 
    id="backViewerBtn"
    class="back-btn">

        ←

    </button>





    <div class="connect-card">


        <h3>

            اتصال به دوربین

        </h3>



        <input
        id="codeInput"
        maxlength="4"
        placeholder="0000">



        <button
        id="connectBtn"
        class="primary-btn">


            اتصال


        </button>



    </div>






    <div class="video-container">


        <video
        id="remoteVideo"
        autoplay
        playsinline>
        </video>




        <div
        class="connection-badge"
        id="viewerStatus">


            🟡 در حال اتصال


        </div>



    </div>





    <div class="bottom-controls">


        <button
        id="captureRemoteBtn">


            📸


        </button>


    </div>



</section>





</div>






<!-- =========================
        CANVAS
========================= -->


<canvas
id="captureCanvas"
style="display:none;">
</canvas>






<!-- =========================
        SCRIPTS
========================= -->


<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script src="/socket.io/socket.io.js"></script>


<script src="ui.js"></script>

<script src="camera.js"></script>

<script src="webrtc.js"></script>

<script src="capture.js"></script>

<script src="qr.js"></script>

<script src="script.js"></script>



</body>

</html>
